name: dead-links

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # every day at midnight

jobs:
  md-dead-link-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: |
          pnpm install
          pnpm build
      - uses: untitaker/hyperlink@0.3.2
        with:
          args: _site/ --check-anchors